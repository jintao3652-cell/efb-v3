# 应用自身命令的权限清单（脚本生成，改动请同步 lib.rs 的 generate_handler）。
#
# Tauri 2 一旦发现 app 级权限清单，就会对所有非插件命令做 ACL 校验：
# 这里没列出的命令会被直接拒绝，报「xxx not allowed. Plugin not found」。
# 页面来源从 localhost 换成 127.0.0.1（或反过来）也会走这套校验，
# 所以能力文件里除 local 之外，还给本地开发服务器的两个来源开了 remote。

[[permission]]
identifier = "allow-api-proxy"
description = "允许前端调用 api_proxy"
commands.allow = ["api_proxy"]

